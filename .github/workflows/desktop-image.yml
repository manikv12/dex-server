name: Desktop image

# Builds the bots' desktop image and uploads it to GitHub's registry.
# Run it by hand with the release's version (like 0.1.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (like 0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: desktop
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dex-desktop:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/dex-desktop:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
